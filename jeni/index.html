.crop{pointer-events:auto}
.chead{display:flex;align-items:center;gap:6px;padding-right:44px}.chead .rh{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .cb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--leaf);display:grid;place-items:center;flex:none}
.chat .ccall{justify-self:center;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);margin:4px 0}.chat .ccall svg.i{width:14px;height:14px}.chat .cgift{color:var(--gold)}
.chat .cday{justify-self:center;font-size:11px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:8px 0 4px}
.chat .cpics{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px;margin:2px 0}
.chat .cpics img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--line);display:block}
.chat .cfile,.chat .ccard{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;font:inherit;font-size:13px;color:inherit;text-align:left;min-height:44px;width:100%;white-space:normal}
.chat .cfile small,.chat .ccard small{display:block;color:var(--mute);font-size:11px}
.say.c3{grid-template-columns:auto minmax(0,1fr) auto}
.say .cplus{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1;color:var(--leaf);padding:0}
.cpl{display:flex;gap:6px;flex-wrap:wrap}.cpl label.pill input{display:none}
.lbx{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px}
.lbx img{max-width:100%;max-height:100%;object-fit:contain}
.lbx button{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px}
.call{display:grid;justify-items:center;gap:10px;padding:24px 0}
.pav2{width:84px;height:84px;border-radius:28%;display:grid;place-items:center;background:var(--leaf-soft);color:var(--leaf);font-size:32px;font-weight:700;animation:shine 2.4s ease-in-out infinite}
.mini{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:8px 0;text-align:left;font-size:14px}
.mini:first-of-type{border-top:0}
.mini span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .mini small{color:var(--mute);font-size:12px}
.pj .link{border:0;background:none;padding:6px 0;color:var(--leaf);font-size:13px;text-decoration:underline}
.form{display:grid;gap:10px}
.guide{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:24;border:1px dashed var(--gold);background:var(--card);color:var(--gold);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;min-height:34px;box-shadow:0 6px 18px -8px rgba(0,0,0,.6)}
.gl{display:grid;gap:8px}
.gi{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.gi .n{width:24px;height:24px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);display:grid;place-items:center;font-size:12px;font-weight:700}
.gi b{font-size:14px} .gi small{grid-column:2/4;font-size:12px;color:var(--mute);line-height:1.5}
.gi .pill{min-height:34px;font-size:13px}

/* カード（1.586）：中身はカードいっぱい、情報はその上。持っているときだけ黄金らせんの印が現れて光る */
.jc2{container-type:inline-size;aspect-ratio:1.586;max-width:100%;position:relative;perspective:1400px}
.jc2 .in{position:absolute;inset:0;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.jc2.on .in{transform:rotateY(180deg)}
.jc2 .face{position:absolute;inset:0;border-radius:5.2cqw;overflow:hidden;color:#1f1b14;backface-visibility:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.1),0 12px 26px -14px rgba(0,0,0,.6)}
.jc2 .back{transform:rotateY(180deg)}
.jc2 .paper,.jc2 .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.jc2 .gfield{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.jc2 .gfield path{vector-effect:non-scaling-stroke}
.jc2 .shade{position:absolute;inset:0;pointer-events:none}
.jc2 .face[data-ink="l"] .shade{background:linear-gradient(180deg,rgba(0,0,0,var(--tc,.28)),rgba(0,0,0,0) 26%,rgba(0,0,0,0) 44%,rgba(0,0,0,var(--sc,.5)))}
.jc2 .face[data-ink="d"] .shade{background:linear-gradient(180deg,rgba(255,255,255,var(--tc,.4)),rgba(255,255,255,0) 26%,rgba(255,255,255,0) 44%,rgba(255,255,255,var(--sc,.55)))}
.jc2 .face[data-busy]{--sc:.85;--tc:.7}
.jc2 .face[data-ink="l"]{--ink:#fff;--halo:rgba(0,0,0,.55)} .jc2 .face[data-ink="d"]{--ink:#1f1b14;--halo:rgba(255,255,255,.75)}
.jc2 .txt,.jc2 .jno,.jc2 .excerpt{color:var(--ink);text-shadow:0 0 1px var(--halo),0 0 2px var(--halo),0 1px 10px var(--halo)}
.jc2 .txt{position:absolute;left:6cqw;right:24cqw;bottom:5.4cqw}
.jc2 .k{font-size:3cqw;letter-spacing:.08em;opacity:.85}
.jc2 .t{font-size:6cqw;font-weight:700;line-height:1.3;white-space:normal;overflow:visible;text-wrap:balance}
.jc2 .by{font-size:3.4cqw;opacity:.85}
.jc2 .jno{position:absolute;left:6cqw;top:5cqw;right:30cqw;font-size:2.8cqw;letter-spacing:.14em;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc2 .excerpt{position:absolute;left:6cqw;right:8cqw;top:13cqw;margin:0;font-size:3.6cqw;line-height:1.75;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;opacity:.85}
.jc2 .mark{position:absolute;right:5.4cqw;bottom:5cqw;width:15cqw;border:0;background:none;padding:0;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .2s}
.jc2.held .mark{opacity:1;pointer-events:auto}
.jc2 .mark svg{display:block;width:100%;height:auto;overflow:visible}
.jc2 .mark .halo{stroke:var(--halo)}
.jc2 .ln{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .25s ease}
.jc2.drawing .mark{opacity:1}
.jc2.drawing .ln{stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
.jc2.held .ln{stroke-dashoffset:0}
.jc2.held .mark svg{animation:glow 3.6s ease-in-out 1.2s infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 .3cqw rgba(226,182,78,.35))}50%{filter:drop-shadow(0 0 1.8cqw rgba(226,182,78,1))}}
.jc2 .qr{position:absolute;left:6cqw;top:50%;transform:translateY(-50%);width:44cqw;height:44cqw}
.jc2 .qr svg{width:100%;height:100%;display:block}
.jc2 .bk{position:absolute;left:55cqw;right:6cqw;top:7.5cqw;bottom:7cqw;display:flex;flex-direction:column;gap:1.6cqw;color:#1f1b14}
.jc2 .bk .no{font-size:3.2cqw;color:#7a705d;letter-spacing:.1em}
.jc2 .bk .bt{font-size:4.6cqw;font-weight:700;line-height:1.35}
.jc2 .bk .how{font-size:3.1cqw;color:#5e5546;line-height:1.5}
.jc2 .wback .qr{left:5cqw;width:33cqw;height:33cqw;top:7cqw;transform:none}.jc2 .wback .bk{left:43cqw;right:5cqw;top:6cqw;bottom:5cqw}.jc2 .wal{margin-top:auto;height:24cqw;display:grid;grid-template-rows:auto 1fr;gap:1.4cqw}.jc2 .wal .wh{display:flex;align-items:center;gap:1.2cqw;font-size:3cqw;font-weight:700;color:#3b352a}.jc2 .wal .wh svg.i{width:4.2cqw;height:4.2cqw}.jc2 .wal .wh span{font-weight:500;font-size:2.5cqw;color:#8a7f6a;border:1px solid #cbbf9f;border-radius:99px;padding:0 1.4cqw}.jc2 .wal .wb{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw}.jc2 .wal .wb button{display:grid;place-items:center;align-content:center;gap:.8cqw;border:1px solid #cbbf9f;background:rgba(255,255,255,.55);color:#8a7f6a;border-radius:3.2cqw;font:inherit;font-size:3.1cqw;font-weight:700;padding:0}.jc2 .wal .wb svg.i{width:5cqw;height:5cqw}
.jc2 .bk dl{margin:auto 0 0;display:grid;grid-template-columns:auto 1fr;column-gap:2.4cqw;font-size:3.2cqw;line-height:1.6}
.jc2 .bk dt{color:#7a705d} .jc2 .bk dd{margin:0;overflow-wrap:anywhere}
.jc2 .pav{position:absolute;left:6cqw;top:12cqw;width:15cqw;height:15cqw;border-radius:28%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 2px 6px rgba(0,0,0,.25);background-size:cover;background-position:center;display:grid;place-items:center;background:#3f7a4c;color:#fff;font-weight:700;font-size:6cqw}
.jc2 .circ{margin-left:0;font-size:2.6cqw;padding:.4cqw 1.8cqw;border-radius:99cqw;background:rgba(0,0,0,.45);color:#fff;letter-spacing:.06em}
.jc2 .pcomm{position:absolute;right:4.4cqw;bottom:4.4cqw;display:flex;gap:2cqw}.jc2 .pcomm button{width:10cqw;height:10cqw;border:0;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.2)}.jc2 .pcomm svg.i{width:5cqw;height:5cqw}
.jc2 .cfav{position:absolute;right:calc(4.4cqw + 15cqw);top:3.6cqw;width:9cqw;height:9cqw;border:0;border-radius:50%;background:rgba(0,0,0,.32);color:#fff;display:grid;place-items:center;padding:0}.jc2 .cfav svg.i{width:4.6cqw;height:4.6cqw}.jc2 .cfav.on svg.i{fill:#f2c14e;stroke:#f2c14e}
.jc2 .ctalk{position:absolute;right:4.4cqw;top:3.6cqw;display:flex;align-items:center;gap:1cqw;border:0;background:rgba(0,0,0,.32);color:#fff;border-radius:99cqw;padding:1.2cqw 2.4cqw;font-size:3cqw;min-height:9cqw}
.jc2 .ctalk svg.i{width:4.4cqw;height:4.4cqw}
.jc2 .ctalk span:empty{display:none}
@media (prefers-reduced-motion: reduce){.done .coin,.coin.idle{animation:none}.lp.pressing i{transition:none}.jc2 .in,.jc2 .ln,.ring rect{transition:none}.jc2.held .mark svg,.pmark,.done .coin{animation:none}.toast{transition:none}}

<script>// jeni の決まり（試験版）。署名つきの出来事（イベント）の並びから、だれが計算しても同じ状態になる。
// 運営もサーバーもいない。決まりに合わない出来事は、どの画面でも同じように無視される。
//
// jeni の5つのきまり
//  1 はじまり：認められて参加すると、決まった量の jeni が届く（jeni が新しく生まれるのはここだけ）
//  2 持つ　　：持つと、カードに書かれたものを受け取れる。作った人から持つと、値段の分の jeni が作った人へ。値段はずっと変わらない
//             （デジタルは元のデータを何度でも。現物はそのものを1回。受け取るとなくなるものは「使った」になる）
//  3 譲る　　：数に限りのあるカードは、持っている人から同じ値段で譲り受ける。jeni は手放した人へ
//  4 投げ銭　：半分は作った人へ、半分は持っている人へ（枚数に応じて）。受け取るとなくなるもの（数に限りのあるカード）と、お店・会社や団体は全額が作った人へ。
//             プロジェクトは、半分を自分のカードをつないで育てた人で等しく分ける（版2から）
//  5 上限　　：同じカードは3枚まで（無料のカードは1枚まで）。使うか贈ると、また持てる
"use strict";
(function (root) {
  const R = {
    version: 4,         // きまりの版（2：プロジェクトへの投げ銭の半分は、自分のカードをつないだ人へ。3：1人が認められるのは10人まで）。出来事には {v: 版} を付ける。版のない出来事は 1 とみなす。知らない（新しすぎる）版は読まない
    start: 1000,        // 参加したときに届く jeni（配る量は使われ方を見て変わることがある。変わるときも全員に同じきまり）
    vouchMax: 10,       // 1人が認められる人数のいちばん多いとき（はじまりの人と、その人が認めた人）
    vouchBy: [10, 10, 10, 5, 3],   // はじまりの人から何段目か（0＝はじまりの人）で、認められる人数（版4から。近い2段は多く、3次は5人、4次から3人）。版3は全員10人、版2までは3人
    capPaid: 3,         // 同じカードを持てる数
    capFree: 1,         // 無料のカードを持てる数
    priceMax: 1000000,
    tipMax: 1000000,
    sendMax: 1000000,   // jeni を直接贈れる額の上限（1回）
    futureSkew: 600,    // 未来の時刻の出来事は、この秒数より先なら無視する
    saleMax: 600,       // その場で売るカードの QR が使える長さ（秒）の上限
    founders: [],       // 最初の人たち（だれにも認められずに参加できる）。試験のはじめに決める
    flagsToHide: 2,     // 危ないカード・会話を隠すのに要る知らせの数（実績のある別々の人から）
    redeemMax: 600,     // 現物を引き換える QR が使える長さ（秒）の上限
    commentMax: 500,
    inviteMax: 7 * 86400,   // 招待のリンク・QR が使える長さ（秒）の上限
  };
  R.vmax = u => R.vouchBy[Math.min((u && u.depth) || 0, R.vouchBy.length - 1)];   // いまの版で、その人が認められる人数
  const KINDS = ["rwa", "event", "service", "music", "video", "picture", "text", "app", "shop", "org", "project", "other"];
  // つなぐカード：ほかのカードを束ねる。プロジェクトはだれでも自分のカードをつなげる。お店・会社や団体は、作った人だけが自分のカードをつなぐ
  const BUNDLE = ["project", "shop", "org"], OPEN_BUNDLE = ["project"];
  const COUNTED = ["rwa", "event", "service"];   // 数があるもの（持った人に1回）。イベントの定員・サービスの枠もいる
  const AT = ["rwa", "event", "service", "shop"];   // 日時・場所・地図の点（受け取る場所・会場・お店）を持てるもの
  // カードの裏の QR は、いつも「そのカードを開く」だけ（外のリンクや支払いにはしない：にせの画面へ誘う悪用を防ぎ、読んだだけで jeni が動かないように）
  const isHex = (s, n) => typeof s === "string" && new RegExp(`^[0-9a-f]{${n}}$`).test(s);
  const int = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
  const str = (v, n) => typeof v === "string" ? v.slice(0, n) : "";

  // 小さな SHA-256（その場で売るときの「一度きりの番号」を確かめるため。計算は同期で、どの画面でも同じ）
  function sha256hex(text) {

    bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
    for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (len >>> (i * 8)) & 255);
    let h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const r = (x, n) => (x >>> n) | (x << (32 - n));
    for (let o = 0; o < bytes.length; o += 64) {
      const w = new Array(64);
      for (let i = 0; i < 16; i++) w[i] = (bytes[o + i * 4] << 24) | (bytes[o + i * 4 + 1] << 16) | (bytes[o + i * 4 + 2] << 8) | bytes[o + i * 4 + 3];
      for (let i = 16; i < 64; i++) { const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
      let [a, b, c, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        const t1 = (hh + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
        const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      h = h.map((v, i) => (v + [a, b, c, d, e, f, g, hh][i]) | 0);
    }
    return h.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("");
  }

  function reduce(events, now, opt = {}) {
    const founders = new Set(opt.founders || R.founders);
    const evs = events.filter(e => e && e.created_at <= now + R.futureSkew).slice()
      .sort((a, b) => a.created_at - b.created_at || (a.id < b.id ? -1 : 1));
    // 名前の付いた表は、ふつうの物の性質を持たない形で作る（"__proto__" などの番号を送り込まれても、表そのものが書き換わらないように）
    const S = {users: Object.create(null), cards: Object.create(null), circles: Object.create(null), comments: Object.create(null), log: [], genesis: null, sends: [], sealed: []};
    const U = pk => S.users[pk] || (S.users[pk] = {pk, name: "", member: false, bal: 0, vouchedBy: null, vouched: [], joinedAt: null, deals: 0, friends: [], invites: []});
    // 実績：持った・持たれた・譲った・譲られたことが1回でもある人（知らせを出せるのはこの人たち）
    const trusted = pk => S.users[pk] && S.users[pk].member && S.users[pk].deals >= 1;
    const flagsOf = (o, pk) => { o.flags = o.flags || []; if (o.flags.includes(pk)) return false; o.flags.push(pk); if (o.flags.length >= R.flagsToHide) o.hidden = true; return true; };
    // カード1枚ずつ（copy）を持ち主ごとに数える。used：使った（受け取った）もの。from：作った人から持ったか、譲り受けたか
    const holdsOf = (c, pk) => c.copies.filter(x => x.owner === pk && !x.used);
    const cap = c => c.price ? R.capPaid : R.capFree;
    // 残り＝作った数から、作った人が渡した数を引いたもの（譲ったり贈ったりしても戻らない。返したときだけ戻る）
    const left = c => c.supply == null ? Infinity : c.supply - c.issued;
    const pay = (from, to, n) => { U(from).bal -= n; U(to).bal += n; };
    const vmaxOf = (u, v) => (v || 1) >= 4 ? R.vouchBy[Math.min(u.depth || 0, R.vouchBy.length - 1)] : (v || 1) === 3 ? 10 : 3;
    const join = (pk, at, by) => { const u = U(pk); u.member = true; u.bal += R.start; u.joinedAt = at; u.vouchedBy = by; u.depth = by ? (U(by).depth || 0) + 1 : 0; };
    const ok = (e, what) => S.log.push({at: e.created_at, id: e.id, by: e.pubkey, what});

    for (const e of evs) {
      let c; try { c = JSON.parse(e.content); } catch (x) { continue; }
      if (!c || typeof c !== "object" || (c.v !== undefined && !(Number.isInteger(c.v) && c.v >= 1 && c.v <= R.version))) continue;
      const me = U(e.pubkey), t = e.created_at;
      // 最初の人たちは、何か出来事を出した時点で参加
      if (!me.member && founders.has(e.pubkey)) join(e.pubkey, t, null);
      // はじまりの人（つなぐ版）：始める人だけが知っている番号（の要約が決まりに書いてある）を最初に出した1人が参加する。だれにも認められずに参加できるのはこの1人だけ
      if (c.t === "genesis") {
        if (!opt.genesis || S.genesis || me.member || typeof c.code !== "string" || sha256hex(c.code) !== opt.genesis) continue;
        S.genesis = e.pubkey; join(e.pubkey, t, null); ok(e, "genesis"); continue;
      }

      if (c.t === "profile") { me.name = str(c.name, 40); me.line = str(c.line, 60); continue; }

      // 1 はじまり：参加している人が、まだの人を認める（はじまりの人から遠いほど少なく：10→10→5→3人）
      const vmax = u => vmaxOf(u, c.v);
      if (c.t === "vouch") {
        if (!me.member || !isHex(c.who, 64) || c.who === e.pubkey || me.vouched.length >= vmax(me)) continue;
        if (U(c.who).member) continue;
        me.vouched.push(c.who); join(c.who, t, e.pubkey); ok(e, "vouch"); continue;
      }

      // 招待：参加している人が、一度きりの番号（の要約）と期限を出す。リンクや QR で番号を受け取った人が「参加」を出すと、認めたのと同じになる
      // （認められるのは1人10人まで。まだ使われていない招待も数に入れる）
      if (c.t === "invite") {
        const open = me.invites.filter(x => !x.used && x.until >= t).length;
        if (!me.member || !isHex(c.lock, 64) || !int(c.until, t, t + R.inviteMax) || me.vouched.length + open >= vmax(me)) continue;
        me.invites.push({id: e.id, lock: c.lock, until: c.until, used: null}); ok(e, "invite"); continue;
      }
      if (c.t === "join") {
        if (me.member || !isHex(c.by, 64) || typeof c.code !== "string") continue;
        const inv = U(c.by), x = inv.invites.find(y => y.id === c.invite);
        if (!inv.member || !x || x.used || t > x.until || sha256hex(c.code) !== x.lock || inv.vouched.length >= vmax(inv)) continue;
        x.used = e.pubkey; inv.vouched.push(e.pubkey); join(e.pubkey, t, c.by); ok(e, "join"); continue;
      }

      // 友達：相手のプロフィールカードを持つ（無料・1人1枚）。お互いに友達なら、2人だけで話せる
      if (c.t === "friend" || c.t === "unfriend") {
        if (!me.member || !isHex(c.who, 64) || c.who === e.pubkey || !U(c.who).member) continue;
        me.friends = me.friends.filter(x => x !== c.who); if (c.t === "friend") me.friends.push(c.who);
        ok(e, c.t); continue;
      }
      // 会話：カードの公開の会話（コメント）。参加している人だけ。輪のカードは輪の人だけ
      if (c.t === "comment") {
        const card = S.cards[c.card], text = str(c.text, R.commentMax).trim();
        if (!card || card.hidden || card.gone || !me.member || !text) continue;
        if (card.circle && !S.circles[card.circle].members.includes(e.pubkey)) continue;
        const cm = {id: e.id, card: card.id, by: e.pubkey, at: t, text, holder: holdsOf(card, e.pubkey).length > 0, flags: [], hidden: false};
        S.comments[e.id] = cm; (card.talk = card.talk || []).push(e.id); ok(e, "comment"); continue;
      }
      // 危ないものを知らせる：実績のある別々の人2人で、カードや会話が隠れる。自分のものには出せない
      if (c.t === "flag") {
        if (!trusted(e.pubkey)) continue;
        const target = c.card ? S.cards[c.card] : c.comment ? S.comments[c.comment] : null;
        if (!target || target.by === e.pubkey) continue;
        if (flagsOf(target, e.pubkey)) ok(e, "flag"); continue;
      }
      // 自分の書いた会話を消す（記録には「消した」ことが残る）
      if (c.t === "uncomment") { const cm = S.comments[c.comment]; if (!cm || cm.by !== e.pubkey || cm.removed) continue; cm.removed = true; cm.hidden = true; ok(e, "uncomment"); continue; }

      // 仲間の輪：作った人と、選ばれた人たち。輪の中のカードの中身は、輪の鍵で封をして置く（外からは読めない）
      if (c.t === "circle") {
        if (!Array.isArray(c.members) || c.members.length > 50 || !c.members.every(m => isHex(m, 64))) continue;
        S.circles[e.id] = {id: e.id, by: e.pubkey, name: str(c.name, 40), members: [...new Set([e.pubkey, ...c.members])], at: t};
        ok(e, "circle"); continue;
      }
      if (c.t === "circle-add") {
        const ci = S.circles[c.circle]; if (!ci || ci.by !== e.pubkey || !isHex(c.who, 64)) continue;
        if (!ci.members.includes(c.who)) ci.members.push(c.who); continue;
      }
      // 輪から抜ける（本人）・外す（輪を作った人）。作った人は抜けられない
      if (c.t === "circle-leave" || c.t === "circle-remove") {
        const ci = S.circles[c.circle]; if (!ci) continue;
        const who = c.t === "circle-leave" ? e.pubkey : c.who;
        if (c.t === "circle-remove" && ci.by !== e.pubkey) continue;
        if (who === ci.by || !ci.members.includes(who)) continue;
        ci.members = ci.members.filter(m => m !== who); ok(e, c.t); continue;
      }

      // カードを作る：参加している人だけ（だれでも鍵を作れるので、認められた人だけにしてばらまきを防ぐ）
      if (c.t === "card") {
        if (!me.member || !KINDS.includes(c.kind) || !int(c.price, 0, R.priceMax)) continue;
        const supply = c.supply == null ? null : (int(c.supply, 1, 100000) ? c.supply : undefined);
        if (supply === undefined) continue;
        const card = {id: e.id, by: e.pubkey, at: t, kind: c.kind, title: str(c.title, 80), body: str(c.body, 2000), media: str(c.media, 300),
          price: c.price, supply, copies: [], queue: [], tips: 0, tipped: 0, refunds: 0, circle: null, issued: 0, talk: [], items: [], flags: [], hidden: false};
        if (c.circle !== undefined) { const ci = S.circles[c.circle]; if (!ci || !ci.members.includes(e.pubkey)) continue; card.circle = ci.id; }
        // その場で売る：一度きりの番号（の要約）と期限。番号を知っている人（QR を読んだ人）だけが持てる。持つと同時に受け取り済み
        if (c.kind === "project") { card.want = str(c.want, 200); card.state = "doing"; }
        if ((c.kind === "event" || c.kind === "service") && supply == null) continue;
        if (BUNDLE.includes(c.kind) && (c.price !== 0 || supply != null)) continue;   // つなぐカードは無料・数なし。持つ＝常連・会員・仲間になる（知らせが届く）   // イベントは定員、サービスは枠がいる。持つ＝参加券・受ける券
        if (AT.includes(c.kind)) {
          card.when = str(c.when, 60); card.place = str(c.place, 100);
          if (c.geo !== undefined) { const g = c.geo; if (!Array.isArray(g) || g.length !== 2 || !g.every(Number.isFinite) || Math.abs(g[0]) > 90 || Math.abs(g[1]) > 180) continue; card.geo = [Math.round(g[0] * 1e5) / 1e5, Math.round(g[1] * 1e5) / 1e5]; }
        }
        if (c.lock !== undefined) {
          if (!isHex(c.lock, 64) || !int(c.until, t, t + R.saleMax) || supply !== 1) continue;
          card.lock = c.lock; card.until = c.until; card.handover = true;
        }
        S.cards[e.id] = card; ok(e, "card"); continue;
      }

      // プロジェクトを育てる：自分のカードを、プロジェクトのカードにつなぐ。外すのは、つないだ人かプロジェクトを作った人
      if (c.t === "attach" || c.t === "detach") {
        const pj = S.cards[c.project], it = S.cards[c.card];
        if (!pj || !it || !BUNDLE.includes(pj.kind) || pj.hidden || it.hidden || pj.gone || it.gone || !me.member || pj.id === it.id) continue;
        if (c.t === "attach" && !OPEN_BUNDLE.includes(pj.kind) && pj.by !== e.pubkey) continue;
        if (pj.circle && !S.circles[pj.circle].members.includes(e.pubkey)) continue;
        if (c.t === "attach") { if (it.by !== e.pubkey || pj.items.some(x => x.card === it.id)) continue; pj.items.push({card: it.id, by: e.pubkey, at: t}); }
        else { const i = pj.items.findIndex(x => x.card === it.id); if (i < 0 || (pj.by !== e.pubkey && pj.items[i].by !== e.pubkey)) continue; pj.items.splice(i, 1); }
        ok(e, c.t); continue;
      }

      // プロジェクトの状態（準備中・進行中・できた）は、作った人だけが変えられる
      if (c.t === "pjstate") { const pj = S.cards[c.project]; if (pj && pj.kind === "project" && pj.by === e.pubkey && ["prep", "doing", "done"].includes(c.state)) pj.state = c.state; continue; }

      // jeni を贈る：参加している人へ、直接（カードはいらない）。だれからだれへ何 jeni かは記録に残る
      if (c.t === "send") {
        const to = c.to;
        if (!me.member || !isHex(to, 64) || to === e.pubkey || !U(to).member || !int(c.amount, 1, R.sendMax) || me.bal < c.amount) continue;
        pay(e.pubkey, to, c.amount); S.sends.push({id: e.id, from: e.pubkey, to, amount: c.amount, at: t}); ok(e, "send"); continue;
      }
      // 鍵をかけて持つ（つなぐ版）：どのカードかは、持った人と作った人だけが読める封の中。記録に出るのは「だれが、だれに、いくら払ったか」だけ。
      // 封の中は2人の画面だけで開いて「持っている」に足す（数に限りのないカードだけ・投げ銭の分け前は受け取らない、なので残高はどの画面でも同じ）
      if (c.t === "phold") {
        const to = c.to;
        if (!me.member || !isHex(to, 64) || to === e.pubkey || !U(to).member || !int(c.amount, 0, R.priceMax) || me.bal < c.amount || typeof c.sealed !== "string" || c.sealed.length > 2000) continue;
        pay(e.pubkey, to, c.amount); if (c.amount) { me.deals++; U(to).deals++; }
        S.sealed.push({id: e.id, from: e.pubkey, to, amount: c.amount, sealed: c.sealed, at: t}); ok(e, "phold"); continue;
      }
      const card = S.cards[c.card];
      if (!card || card.gone) continue;   // 取り下げたカードには、もう何もできない
      if (card.hidden && ["hold", "want", "tip"].includes(c.t)) continue;   // 隠されたカードは、新しく持てない・投げ銭できない
      if (card.closed && ["hold", "want"].includes(c.t)) continue;           // 受付を終えたカードは、新しく持てない・順番を待てない

      // 直す：作った人だけ。題・説明・日時・場所・地図の点・求めているもの。値段・数・種類は直せない（持った人との約束なので）
      if (c.t === "edit") {
        if (card.by !== e.pubkey) continue;
        (card.history = card.history || []).push({at: t, title: card.title, body: card.body});   // 直す前の題と説明を残す（持った人が確かめられるように）
        if (c.title !== undefined) card.title = str(c.title, 80);
        if (c.body !== undefined) card.body = str(c.body, 2000);
        if (AT.includes(card.kind)) {
          if (c.when !== undefined) card.when = str(c.when, 60);
          if (c.place !== undefined) card.place = str(c.place, 100);
          if (c.geo === null) delete card.geo;
          else if (c.geo !== undefined) { const g = c.geo; if (Array.isArray(g) && g.length === 2 && g.every(Number.isFinite) && Math.abs(g[0]) <= 90 && Math.abs(g[1]) <= 180) card.geo = [Math.round(g[0] * 1e5) / 1e5, Math.round(g[1] * 1e5) / 1e5]; }
        }
        if (card.kind === "project" && c.want !== undefined) card.want = str(c.want, 200);
        card.edits = (card.edits || 0) + 1; ok(e, "edit"); continue;
      }
      // 取り下げる：作った人だけ。まだだれも持っていなければ消える。持っている人がいれば「受付を終える」（持っている人のものはそのまま）
      if (c.t === "retire") {
        if (card.by !== e.pubkey) continue;
        if (!card.copies.length) card.gone = true; else card.closed = true;
        card.queue = []; ok(e, "retire"); continue;
      }

      // 2 持つ：作った人から（数に限りがあるときは残りがあるあいだ）
      if (c.t === "hold") {
        if (!me.member || e.pubkey === card.by || left(card) <= 0) continue;
        if (holdsOf(card, e.pubkey).length >= cap(card) || me.bal < card.price) continue;
        if (card.lock && (t > card.until || typeof c.code !== "string" || sha256hex(c.code) !== card.lock)) continue;
        if (card.circle && !S.circles[card.circle].members.includes(e.pubkey)) continue;
        // 持ち方：show＝みんなに見せる、hide＝画面に出さない（記録を調べれば分かる）、lock＝何を持ったかに鍵（数に限りのないカードだけ。投げ銭の分け前は受け取らない）
        const vis = ["show", "hide", "lock"].includes(c.vis) ? c.vis : "show";
        if (vis === "lock" && card.supply != null) continue;

/* ---- 黄金らせんの印・地の模様・QR ---- */
const gmark = (w, {frame = false, sw = 2.4, line = false, halo = false} = {}) => {
  const k = PHI / w, pad = sw * 2.2 * k;
  return `<svg viewBox="${-pad} ${-pad} ${PHI + pad * 2} ${1 + pad * 2}" width="${w}" aria-hidden="true">
    ${halo ? `<path class="halo ${line ? "ln" : ""}" pathLength="1" d="${G}" fill="none" stroke-width="${sw * 2.6 * k}" stroke-linecap="round"/>` : ""}
    <path class="${line ? "ln" : ""}" pathLength="1" d="${G}" fill="none" stroke="currentColor" stroke-width="${sw * k}" stroke-linecap="round"/>
    ${frame ? `<rect x="0" y="0" width="${PHI}" height="1" rx=".1" fill="none" stroke="currentColor" stroke-width="${sw * 1.5 * k}"/>` : ""}</svg>`;
};
const gfield = (k = 1) => `<svg class="gfield" viewBox="0 0 ${PHI} 1" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke-linecap="round">
  <path d="${G}" stroke="#000" stroke-opacity="${.16 * k}" stroke-width="2.6"/><path d="${G}" stroke="#fff" stroke-opacity="${.32 * k}" stroke-width="1"/></g></svg>`;
function qrSvg(text, cls = "") {
  const M = makeQR(text), n = M.length, q = 2, W = n + q * 2;
  let r = ""; M.forEach((row, y) => row.forEach((d, x) => { if (d) r += `M${x + q},${y + q}h1v1h-1z`; }));
  const lw = W * .24, lh = lw / 1.45, iw = lw * .74, k = PHI / iw;
  return `<svg class="${cls}" viewBox="0 0 ${W} ${W}" role="img" aria-label="QR" shape-rendering="crispEdges"><rect width="${W}" height="${W}" fill="#fff"/><path d="${r}" fill="#1a1608"/>
    <rect x="${(W - lw) / 2}" y="${(W - lh) / 2}" width="${lw}" height="${lh}" rx="${lh * .18}" fill="#fff"/>
    <g transform="translate(${(W - iw) / 2} ${(W - iw / PHI) / 2}) scale(${iw / PHI})" shape-rendering="geometricPrecision"><path d="${G}" fill="none" stroke="#1a1608" stroke-width="${.06 * k * 1.6}" stroke-linecap="round"/>
    <rect x="0" y="0" width="${PHI}" height="1" rx=".1" fill="none" stroke="#1a1608" stroke-width="${.09 * k * 1.6}"/></g></svg>`;
}

let lpT = null;
const LP_MS = 1000;   // 長押しの長さ。カードの印が描かれる長さと同じ
function lpStart(b) {
  lpCancel(); b.classList.add("pressing");
  const card = b.dataset.lp === "hold" && $("pg-" + b.dataset.id) && $("pg-" + b.dataset.id).querySelector(".jc2:not(.held)");
  if (card) card.classList.add("drawing");
  if (b.dataset.lp === "qhold") { const t = document.querySelector("#over .qth"); if (t) t.classList.add("drawing"); }
  lpT = setTimeout(() => { b.classList.remove("pressing"); lpT = null; lpDo(b.dataset.lp, b.dataset.id); }, LP_MS);

      ${step < STORY.length - 1 ? `<button type="button" class="link" data-story="${STORY.length}" style="justify-self:center">とばす</button>` : ""}`);
  }
  const sougo = LIVE ? LV.store.get("sougo.me", null) : null;
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  openSheet(`${close}<div class="story">${coin("idle")}</div>
    ${!STANDALONE() ? `<p class="sub warnc" style="font-size:13px;margin:0">${ios ? "先に、共有ボタン →「ホーム画面に追加」。そのアイコンから始めます。" : "ホーム画面に置いてから始めると、アプリのように使えます。"}</p>${INSTALL ? `<button type="button" class="pill go" data-install style="justify-self:start">ホーム画面に置く</button>` : ""}` : ""}
    <ul class="ess"><li>名前は、みんなに見えます</li><li>記録は、消せません</li><li>鍵は、Face ID で守ります</li></ul>
    <label class="fl">名前<input id="st-name" maxlength="40" placeholder="呼び名"></label>
    ${LIVE && PENDING ? "" : `<details class="more"><summary>招待のリンクが届いた人</summary><label class="fl">届いたリンクを貼る<input id="st-inv" autocomplete="off" spellcheck="false" placeholder="https://…#join=…"></label></details>`}
    <button type="button" class="big" data-start>始める</button>
    <details class="more" id="st-old"><summary>前に使っていた人</summary>
      <button type="button" class="big ghost" data-pkrestore>Face ID で戻す</button><label class="fl">控えた鍵（64文字）<input id="st-key" autocomplete="off" spellcheck="false"></label><button type="button" class="pill go" data-startkey>この鍵で戻す</button>
      ${sougo && sougo.sk ? `<button type="button" class="pill" data-startsougo style="justify-self:start">相互レビューと同じ鍵で始める</button>` : ""}</details>`);
}
// 鍵の控え：始めたらすぐ。取るまでは、わたしのカードの印に小さな赤い印
const keySaved = () => !!(LIVE && (LV.store.get("jeni.keysaved", false) || LV.store.get("jeni.kbak", null)));
const SAMPLE_SK = "5a1e".repeat(16);   // 見本の画面で見せる鍵（本物ではない）
const pkOn = () => !!(LIVE && LV.store.get("jeni.kbak", null));
function keySheet(first) {
  const sk = LIVE ? LV.me.sk : SAMPLE_SK, on = pkOn();
  openSheet(`${first ? "" : `<button type="button" class="back" data-close>${icon("back")}戻る</button>`}<h2 class="rh">鍵を守る</h2>
    <p class="sub" style="margin:0">鍵は、jeni でのあなた自身です。Face ID で守ると、機種を変えても戻せます。</p>
    ${on ? `<p class="sub" style="color:var(--leaf);font-weight:700;margin:0">${icon("lock")} Face ID（パスキー）で守っています</p>` : `<button type="button" class="big" data-pksave>Face ID で守る</button>`}
    <details class="more"><summary>64文字の控えも取る</summary>
      <p class="keyv">${sk}</p>${LIVE ? "" : `<p class="sub" style="font-size:11px;margin:0">（見本の鍵）</p>`}
      <p class="sub warnc" style="font-size:12px;margin:0">${icon("lock")} 人に見せない・送らない。jeni がたずねることはありません。</p>
      <div class="row2"><button type="button" class="big ghost" data-keycopy>写す</button><button type="button" class="big" data-keysaved>控えました</button></div></details>
    ${first ? `<button type="button" class="link" data-close style="justify-self:center">あとで</button>` : ""}`);
}
function afterStart(fresh = false) {
  me = LV.me.pk; READ_LOADED = false; liveRecompute(); closeSheet(); home();
  if (fresh && !keySaved()) { if (PENDING) KEYNEXT = true; else setTimeout(() => keySheet(true), 300); }
  if (PENDING) { const [k, v] = PENDING; PENDING = null; setTimeout(() => handleLink(k, v), 300); }
}
let INSTALL = null;   // ホーム画面に置く（置ける端末だけ）
const STANDALONE = () => { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch (x) { return false; } };
function liveBoot() {
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
  addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); INSTALL = ev; });
  me = LV.me ? LV.me.pk : "0".repeat(64);
  $("guide").hidden = true; document.title = "jeni 試験運用";
  document.addEventListener("click", () => setTimeout(liveSaveLocal, 0));
  LV.start(() => { liveRecompute(); if (PENDING && LV.me) { const [k, v] = PENDING; if (["join", "pay", "card", "tip", "hold"].includes(k)) { PENDING = null; handleLink(k, v); } } liveRefresh(); });
  liveRecompute(); home(); netBadge(); loadStamps(); setInterval(netBadge, 3000); setInterval(() => LV.backupKeep(), 60000); setInterval(() => { if (LV.me) liveRefresh(); }, 30000);
  const h = location.hash.match(/#(me|card|pay|used|join|genesis|tip|hold)=([0-9a-zA-Z.]+)/);
  if (h) { history.replaceState(null, "", location.pathname); if (!LV.me) { PENDING = [h[1], h[2]]; return startSheet(); } setTimeout(() => handleLink(h[1], h[2]), 600); }
  else if (!LV.me) startSheet();
}

if (LIVE) liveBoot(); else { seed(); home(); }
window.__jt = {MEDIA, PREF, VDIAG, startSheet: () => startSheet(), get S() { return S; }, get EV() { return EV; }, get CHAT() { return CHAT; }, get me() { return me; }, set me(v) { me = v; home(); }, P, emit, detail, home, closeSheet, MK, person: pk => personCard(pk), chatSheet: pk => chatSheet(pk), CALLS, KEPT, get clock() { return clock; }};
